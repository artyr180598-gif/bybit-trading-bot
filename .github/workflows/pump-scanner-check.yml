name: pump-scanner-check

on:
  push:
    branches: ["pump-dump-rebuild"]
  pull_request:
    branches: ["main"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile bot/bot.py
      - run: python -m pip install -r bot/requirements.txt
      - run: python - <<'PY'
import ast
from pathlib import Path
ast.parse(Path("bot/bot.py").read_text())
print("bot/bot.py syntax OK")
PY
